# CloudShop : 1 base PostgreSQL + Metabase (BI) + 3 boutiques Flask + 1 load balancer Nginx
name: cloudshop

# Configuration commune aux 3 boutiques (ancre YAML réutilisée plus bas)
x-boutique: &boutique
  # Image publique sur Docker Hub (ARM64 + AMD64) : téléchargée automatiquement
  image: raniette/cloudshop-boutique:1.0
  # Pour reconstruire l'image depuis le code au lieu de la télécharger,
  # décommenter la ligne suivante puis lancer : docker compose build
  # build: ./boutique
  cpus: 0.1                     # chaque boutique est limitée à 10 % d'un processeur
  environment:
    DB_HOST: postgres
    DB_NAME: cloudshop
    DB_USER: cloudshop
    DB_PASSWORD: cloudshop
  depends_on:
    postgres:
      condition: service_healthy   # on attend que la base soit prête
  restart: always
  # pas de "ports" : les boutiques ne sont joignables que via le load balancer

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cloudshop
      POSTGRES_PASSWORD: cloudshop
      POSTGRES_DB: cloudshop
      TZ: Africa/Tunis
      PGTZ: Africa/Tunis
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d   # init.sql exécuté au tout premier démarrage
      - pgdata:/var/lib/postgresql/data      # les données survivent aux conteneurs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudshop -d cloudshop"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Africa/Tunis
    volumes:
      - mbdata:/metabase-data               # tableaux de bord Metabase conservés
    restart: always

  boutique-1:
    <<: *boutique
    hostname: boutique-1

  boutique-2:
    <<: *boutique
    hostname: boutique-2

  boutique-3:
    <<: *boutique
    hostname: boutique-3

  load-balancer:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./lb/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - boutique-1
      - boutique-2
      - boutique-3
    restart: always

volumes:
  pgdata:
  mbdata:
