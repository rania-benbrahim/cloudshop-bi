# Load balancer Nginx : répartit les requêtes en round robin (à tour de rôle)

# DNS interne de Docker : permet à Nginx de retrouver la nouvelle adresse IP
# d'une boutique quand son conteneur est recréé (vérifiée toutes les 5 s)
resolver 127.0.0.11 valid=5s ipv6=off;

upstream boutique {
    zone boutique 64k;   # mémoire partagée, nécessaire pour "resolve"
    server boutique-1:5000 max_fails=1 fail_timeout=10s resolve;
    server boutique-2:5000 max_fails=1 fail_timeout=10s resolve;
    server boutique-3:5000 max_fails=1 fail_timeout=10s resolve;
}

server {
    listen 80;

    location / {
        proxy_pass http://boutique;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Si une boutique ne répond pas en 1 s, on essaie la suivante
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout;
    }
}
